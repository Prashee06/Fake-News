apiVersion: apps/v1
kind: Deployment

metadata:
  name: fake-news-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fake-news

  template:
    metadata:
      labels:
        app: fake-news

    spec:
      containers:
        - name: fake-news-container
          image: prasheetha06/fake-news-bilstm:latest

          ports:
            - containerPort: 5000